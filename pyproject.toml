[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antennaknobs"
version = "0.67.0"
authors = [
  { name="Steven M. Burns", email="smburns47@gmail.com" },
]
description = "Scriptable antenna design with live, knob-driven tuning"
readme = "README.md"
requires-python = ">=3.10"  # PEP 604 unions in 21 src files; 3.8/3.9 die at import (#735)
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Core runtime deps, imported unconditionally:
#   - momwire — the built-in MoM engine (`from momwire import ...` across the
#     engines/CLI). Now that momwire publishes its own wheels, it is a real
#     declared dependency so `pip install antennaknobs` resolves it from the
#     same index. The vendored git submodule remains for co-development (install
#     it editable to override the wheel); a development checkout that does
#     `pip install -e ./momwire` first satisfies this pin and pip won't refetch.
#     IMPORTANT: the pin is EXACT (==), not a floor. Dev/CI run the submodule,
#     so ONLY this pin protects PyPI installs and the Fly image — and a floor
#     lets a new momwire release silently change antennaknobs behavior on the
#     next deploy/install (momwire 0.6.0 nearly shipped a multi-second default
#     ground solve that way; a floor also let v0.13.0 ship broken against
#     0.2.3). Every momwire upgrade is a deliberate PR: bump this pin, the
#     Dockerfile pin, and the submodule together, confirm the version is on
#     PyPI before tagging a release.
#   - numpy/scipy math throughout; matplotlib for the draw/sweep/pattern plots
#     including the in-house Smith chart (smith_chart.py — scikit-rf was
#     dropped in #332, it was only ever used to draw that chart). CLI/sweep
#     debug tracing goes through the stdlib logging module (enable with `-vv`).
#
# Deliberately NOT listed: PyNEC — the optional NEC2 backend, GPL-2.0-or-later.
# It is installed separately from the python-necpp fork's release wheel (the
# `pynec-accel` distribution; see README) and must never be declared a
# dependency of this MIT package.
dependencies = [
    "momwire==0.48.0",
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
# Web UI: src/antennaknobs/web/server.py is a FastAPI app served by uvicorn.
#   - fastapi (+ its starlette core) is the web framework itself — imported
#     directly by antennaknobs/web/server.py, so it must be declared here.
#   - uvicorn[standard] is the ASGI server. The live-solve channel at /ws is a
#     WebSocket upgrade, so the server needs WS support: bare `uvicorn` ships
#     without it and fails the handshake at runtime. `uvicorn[standard]` already
#     pulls in websockets (+ httptools + uvloop, uvloop a no-op on Windows), but
#     we also list `websockets` explicitly so the /ws dependency is visible and
#     pinned even if uvicorn's extra ever changes.
#   - psutil powers _physical_cpu_count() in antennaknobs.web.server — portable across
#     Windows/macOS/Linux. Falls back to os.cpu_count() if missing, which
#     misfires on chips without HT (pins to half the actual cores).
#   - threadpoolctl sizes the BLAS/OpenMP pools at runtime in
#     antennaknobs.web.server — env vars are snapshotted by each library at
#     import time, which happens (via antennaknobs/__init__) before server.py
#     can set them (issue #377).
#   - schemdraw renders the /schematic panel (issue #652). It lives here as
#     well as in the `schematic` extra because the Docker image installs
#     ".[web]" only — without it the endpoint would 500 in production while
#     the test extra (which includes schemdraw) kept CI green.
web = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "psutil",
    "threadpoolctl",
    "schemdraw>=0.19",
]

# VNA capture (`antennaknobs capture`, issue #597): pyserial drives the USB
# serial console of a NanoVNA. Optional because talking to hardware is a
# capability nothing else in the package needs — the import is lazy, and every
# other entry point (including the whole web server, which must never open a
# serial port) works without it. `antennaknobs.vna.list_candidate_ports()`
# returns empty rather than raising when it is absent, so the CLI's "no device"
# message covers both causes.
vna = ["pyserial"]

# Network schematics (`antennaknobs schematic`, issue #652): schemdraw supplies
# the circuit symbols and an SVG writer. Optional because drawing is not on any
# solve path — and cheap when wanted: schemdraw is MIT with NO required
# dependencies of its own (its matplotlib backend is itself an extra, and we
# use the built-in SVG one).
schematic = ["schemdraw>=0.19"]

# Test suite: `pip install -e ".[test]"` makes `pytest` reproducible from a
# clean clone (the runtime deps in [project] cover the numpy/scipy/matplotlib
# that the solver tests need).
#   - pytest + coverage run the suite.
#   - the web-server tests import the FastAPI app and drive it through
#     Starlette's TestClient, so they need the `web` extra (pulled in via the
#     self-reference below) PLUS an HTTP client for TestClient. starlette>=1
#     imports `httpx2` (it falls back to a deprecated `httpx`), so we pin
#     `httpx2` to get the supported, warning-free path. Without it, the web
#     tests error at collection.
#   - PyNEC is deliberately NOT included (GPL, installed separately per README);
#     the pynec-backed tests skip when it's absent.
#   - the schematic extra is included so the renderer is actually exercised
#     rather than skipped: schemdraw is MIT with no dependencies of its own, so
#     it costs the test environment nothing.
test = ["antennaknobs[web]", "antennaknobs[schematic]", "pytest", "coverage", "httpx2"]

# Local developer tooling — install with `pip install -e ".[dev]"`.
#   - ruff is the linter/formatter, configured under [tool.ruff] below. It is a
#     purely local convenience: CI lints via astral-sh/ruff-action (.github/
#     workflows/ruff.yml), which installs its own ruff, so ruff is deliberately
#     NOT in [project] or the runtime/test extras — end users and the `.[test]`
#     CI install never pull it in.
dev = ["ruff"]

[project.urls]
Homepage = "https://github.com/stevenmburns/antennaknobs"
Issues = "https://github.com/stevenmburns/antennaknobs/issues"

[tool.pytest.ini_options]
# Only discover this project's own suite. Without this, a bare `pytest`
# recurses from the repo root into the momwire submodule's tests, which
# fail to collect (they import momwire's `validation` package, only on-path
# inside the submodule's own setup). CI already passes `tests/` explicitly;
# this makes a bare local `pytest` match, mirroring ruff's momwire exclude.
testpaths = ["tests"]
markers = [
    # Tests that run an antenna solver across a *catalog* of named designs
    # (e.g. tests/test_cebik_designs.py) — the same solve code path repeated
    # design after design. Representative solver/engine coverage stays
    # unmarked and runs on every PR; this marker quarantines the per-design
    # repetition to the full main-only run, so the registry can grow toward
    # many designs without inflating PR feedback. Deselect with
    # `-m "not antenna_computation_check"`.
    "antenna_computation_check: solves a named design as part of broad per-design catalog coverage (run on main, not per-PR)",
    # Benchmark-class validations (thousands-of-segment solves, ~GBs of peak
    # RSS, >>5 s) — NOT unit tests, and NEVER run in CI: one OOM-killed the
    # GitHub runner on top of the catalog lane's accumulated RSS ('runner
    # received a shutdown signal', twice at the same test). The suite-wide
    # rule is that an individual test finishes in ~2 s, 5 s worst case;
    # anything heavier goes here and is run manually after nec-import or
    # engine changes: `python -m pytest -m heavy_mesh`.
    "heavy_mesh: benchmark-sized solve, excluded from CI; run manually",
]

[tool.ruff]
# momwire is a submodule with its own config.
#
# scratch/ is NOT excluded, deliberately. It is checked in, so it is linted —
# the study scripts under it are the record of what produced a published
# number, and a record worth keeping is worth keeping readable. Banking a
# study means cleaning it on the way in.
extend-exclude = ["momwire"]

[tool.ruff.lint]
# `select` is pinned EXPLICITLY, and the value is exactly ruff's default at
# the currently pinned version — verified rule-by-rule, so setting it changes
# nothing today.
#
# It is here because the default is not a constant. Between ruff 0.15.21 and
# 0.16.5 the implicit default grew from 59 enabled rules to 414, which turned
# ~900 pre-existing lines in this repo into errors with no code change. That is
# the mechanism behind every "a new ruff release turned CI red" note in
# .github/workflows/ruff.yml. With `select` written down, a ruff upgrade can
# change how a rule behaves but can no longer change WHICH rules run.
#
# Adding a rule is now a deliberate edit here (see extend-select below), not a
# side effect of a version bump.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
# TID252 bans relative imports, scoped (via the negated per-file-ignore
# below) to the design files only. Designs are user-facing exemplars: any
# builtin must keep working verbatim when copied to ~/.antennaknobs/designs/,
# where it is loaded by file path with no package context, so relative
# imports break on the first line. Core modules keep the usual
# relative-intra-package style.
# B023 (function-uses-loop-variable) is opted into EXPLICITLY: it is not in
# ruff's default set at the pinned version, and inheriting it would mean
# upgrading ruff, which brings ~400 other rules and ~900 findings with it.
#
# It is a MAY-escape warning, not a bug detector — it fires whenever a closure
# reads a loop variable, because it cannot prove the closure outlives the
# iteration. Audited 2026-08-29 across all 60 findings then present: every one
# was consumed inside its own iteration, i.e. zero real bugs. Kept on for the
# case it exists to catch — closures stashed in a loop and called after it
# ends — which no test here would reliably notice.
# BLE001 (blind-except) is selected repo-wide, deliberately UNLIKE B023 above,
# which is per-file-ignored under scratch/ and scripts/. The asymmetry is
# evidence-based: 38 of the 56 blind excepts already annotated when this landed
# were in scripts/, i.e. the authors of the bench and study code were already
# marking them by hand. Exempting those trees would have deleted 38 deliberate
# annotations as newly-dead.
#
# The invariant this buys is NOT "every `except Exception` is justified or a
# lint error" — that claim was true when written and is not true at the pinned
# ruff. Since 0.16.5 BLE001 EXEMPTS a handler that logs with `exc_info=True`
# (0.15.21 flagged it), so the real invariant is: every `except Exception` is
# justified in a comment, a lint error, or logs a traceback. Two sites rely on
# the exemption today, both in web/adapter.py.
#
# Do not "fix" that by annotating them. BLE001 does not fire there, so a
# `# noqa: BLE001` would itself be reported dead by RUF100 — the exemption
# cannot be re-tightened from this end, only upstream.
# S310 (suspicious-url-open-usage) is opted into for one reason: this repo
# opens exactly one URL, from a module-level table of fixed https endpoints,
# and that is the property worth freezing. The rule was already annotated by
# hand at both call sites before it was selected; selecting it turns those
# annotations from prose into a gate, so a future `urlopen` of a
# caller-supplied string cannot land without someone writing down why.
extend-select = [
    # Opted in one at a time, each argued in the comments above.
    "TID252",
    "B023",
    "BLE001",
    "S310",
    # ------------------------------------------------------------------
    # Zero-finding adoption (#1059). Every code below already reports ZERO
    # violations in this tree, so selecting it changes no source line — it
    # only stops the first violation from landing unnoticed. That is the
    # whole point: these are cheap to adopt NOW and expensive later, once
    # the first violation exists and someone has to argue about it.
    #
    # Written as explicit CODES, not family prefixes, for the reason the
    # `select` comment above gives: a prefix silently grows when ruff adds
    # a rule to that family, which is the mechanism that used to turn CI
    # red on unchanged code. `"DTZ"` is one line but not a fixed rule set;
    # the ten DTZ codes are.
    #
    # The prefix trap is not hypothetical here: flake8-debugger is `T10`
    # and is clean, while flake8-print is `T20` with 1,144 violations.
    # Selecting `"T"` to get the former turns on the latter.
    #
    # NOT adopted, though it also reports zero: flake8-fixme (FIX001-004).
    # FIX002 fires on ANY line containing TODO, including a well-formed
    # `# TODO(#941): ...` with an issue link — measured, not assumed. It is
    # a "no TODO comments, ever" policy, and it would make the TD rules
    # below dead letters, since those exist to say how a TODO should be
    # written. Keeping TD and dropping FIX is the coherent pair.

    # FastAPI — the web app is FastAPI, so these are live gates.
    "FAST001", "FAST002", "FAST003",
    # flake8-2020 — sys.version comparisons that break at 3.10 / 4.x.
    "YTT101", "YTT102", "YTT103",
    "YTT201", "YTT202", "YTT203", "YTT204",
    "YTT301", "YTT302", "YTT303",
    # flake8-builtins — shadowing a builtin with a local, arg, or module.
    "A001", "A002", "A003", "A004", "A005", "A006",
    # flake8-datetimez — naive datetimes. Real risk here: solve timestamps
    # and cache keys compare wrongly across a DST boundary if tz is absent.
    "DTZ001", "DTZ002", "DTZ003", "DTZ004", "DTZ005",
    "DTZ006", "DTZ007", "DTZ011", "DTZ012", "DTZ901",
    # flake8-debugger — a stray pdb/breakpoint import reaching main.
    "T100",
    # flake8-future-annotations.
    "FA100", "FA102",
    # flake8-gettext — latent: only fires on gettext-style `_()` calls,
    # which this repo does not currently make. Cheap to keep armed.
    "INT001", "INT002", "INT003",
    # flake8-logging / flake8-logging-format — the web server and the
    # study scripts both log; G004 (f-string in log call) is the one that
    # actually bites, since it formats even when the record is filtered.
    "LOG001", "LOG002", "LOG004", "LOG007", "LOG009", "LOG014", "LOG015",
    "G001", "G002", "G003", "G004", "G010", "G101", "G201", "G202",
    # flake8-quotes — verified NOT to conflict with the formatter here.
    "Q000", "Q001", "Q002", "Q003", "Q004",
    # flake8-slots.
    "SLOT000", "SLOT001", "SLOT002",
    # flake8-tidy-imports — the rest of the family alongside TID252.
    # Latent: both need their own config table to fire, so they are armed
    # for whoever adds one, not gates today.
    "TID251", "TID253",
    # flake8-todos — a TODO must name an author and link an issue. The
    # tree has no TODO comments at all right now, so this costs nothing
    # and fixes the format of the next one.
    "TD001", "TD002", "TD003", "TD004", "TD005", "TD006", "TD007",
    # flynt.
    "FLY002",
    # ------------------------------------------------------------------
    # B905 / RUF007 (#1061). zip() truncates to the shortest argument
    # SILENTLY. In this codebase a length mismatch between, say, segments
    # and currents is not a crash — it is a shorter answer that still looks
    # like an answer, which is the worst failure mode available to us.
    #
    # All 171 sites were decided with evidence, not by reading: `zip` was
    # wrapped to record each caller's file:line and whether its arguments
    # had equal len(), then the suite was run (3,890 tests). 93 sites were
    # observed always-equal; every site that EVER saw a mismatch was the
    # `zip(xs, xs[1:])` successive-pairs idiom, which is definitionally
    # off-by-one and is now `itertools.pairwise` — hence RUF007 alongside,
    # which deletes the zip rather than suppressing the finding. The 55
    # sites the suite never reached were read individually; all were
    # parallel-by-construction, none an intentional truncation.
    #
    # Do NOT reach for B905's autofix. It is offered only under
    # --unsafe-fixes and it inserts `strict=False`, preserving current
    # behaviour — it would silence all 171 findings while changing nothing,
    # locking in exactly the truncation the rule exists to catch.
    #
    # The asymmetry that makes strict=True the right default: a wrong
    # strict=True raises and the suite catches it; a wrong strict=False is
    # silent and nothing catches it. So False must be argued per site.
    "B905",
    "RUF007",
]
# Keep "imported but unused" as a warning instead of auto-stripping.
# Without this, multi-pass edits (add imports first, then add code that
# uses them) can have the import deleted between edits — by the editor's
# format-on-save, the project's auto-fix hook, or a pre-commit run —
# producing a broken next edit. Manual cleanup of unused imports is fine.
# RUF100 for the same reason, learned the hard way in the #1037 audit: its fix
# deletes the WHOLE comment, prose included. A directive like
# `# noqa: PLC0415 — optional extra, imported on use` is documentation of why
# an import is lazy; auto-stripping it discards the explanation along with the
# suppression. Worse, a `--fix` run before a rule is selected reads that rule's
# annotations as dead and removes them — which would have deleted all 56
# BLE001 justifications in #1037 rather than revealing them as the reason to
# turn the rule on. RUF100 stays reportable, never auto-fixable.
unfixable = ["F401", "RUF100"]

[tool.ruff.lint.flake8-tidy-imports]
# "all" also bans single-dot imports: a copied design must not assume it has
# sibling modules (the user dir has none).
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Relative imports are banned only under designs/ (see extend-select above).
"!src/antennaknobs/designs/**" = ["TID252"]
# B023 off for the banked studies and bench scripts. NOT an exclusion of those
# trees — scratch/ stays linted on purpose (see the note above [tool.ruff]) —
# just this one rule, which is noise there: study and bench code builds
# throwaway closures over sweep variables and consumes them on the next line.
# 46 of the 60 findings audited were in one prototype. src/ keeps the rule.
"scratch/**" = ["B023"]
"scripts/**" = ["B023"]
