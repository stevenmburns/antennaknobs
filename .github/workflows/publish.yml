name: publish

# Build and publish the antennaknobs distribution. antennaknobs is pure Python
# (no compiled extension — momwire/PyNEC carry the C++), so this produces a
# single universal py3-none-any wheel plus an sdist; there is no per-platform
# wheel matrix and no cibuildwheel.
#
# Triggers:
#   - push tag v*: build, publish to PyPI (Trusted Publishing), and attach
#     the wheel + sdist to the GitHub Release.
#   - workflow_dispatch: build the dist on a branch to validate packaging
#     (sdist/wheel contents) without publishing — the publish/release jobs are
#     tag-gated, so a manual run only exercises `build`.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # No submodules: the dist is pure Python and does not build momwire.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/antennaknobs/web/frontend/package-lock.json
      - name: Build the React frontend
        # Produces src/antennaknobs/web/static (vite outDir) which setup.py ships
        # as package data, so the wheel serves the browser UI with no Node at
        # install time.
        working-directory: src/antennaknobs/web/frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: pipx run build
      - name: Check metadata
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish-pypi:
    # Publish to PyPI via Trusted Publishing (OIDC) — no stored token. Requires a
    # trusted/pending publisher on pypi.org for project `antennaknobs`: owner
    # stevenmburns, repo antennaknobs, workflow publish.yml, no environment.
    # Omitting repository-url defaults the action to https://upload.pypi.org/legacy/.
    # skip-existing makes a re-run of an already-published version a no-op.
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  published-smoke:
    # The release gate (#1326): install the PUBLISHED pair from PyPI — the
    # exact `pip install "antennaknobs[web]==X.Y.Z"` a user runs — in a fresh
    # venv on every platform we ship wheels for, by running the README's
    # install scripts (scripts/install.sh, scripts/install-windows.ps1). Same
    # matrix and same scripts as test.yml's `wheel-smoke`; the difference is
    # the source: PyPI's copy after propagation, not the artifact we built.
    # v0.71.0 shipped `antennaknobs.Antenna` as None on every plain install
    # (#1323) because every environment that tested it carried pynec-accel;
    # a dev venv is not a user install, so the gate is the user's install.
    #
    # PyPI takes a few minutes to serve a fresh version; the loop retries the
    # whole (idempotent) script until it does or ~15 min pass. A red here
    # means the published release does not install or run as documented —
    # the fix is a follow-up release, and the announcement waits for it.
    name: published-smoke (${{ matrix.os }}, py${{ matrix.python-version }}${{ matrix.pynec == '1' && ', +pynec' || '' }})
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python-version: ["3.12", "3.14"]
        pynec: ["0", "1"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Homebrew libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: README install script against PyPI (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SCRIPT="$GITHUB_WORKSPACE/scripts/install.sh"
          cd "$(mktemp -d)"
          for attempt in $(seq 1 30); do
            if PYTHON=python ANTENNAKNOBS_SPEC="antennaknobs[web]==${VERSION}" PYNEC=${{ matrix.pynec }} bash "$SCRIPT"; then
              exit 0
            fi
            echo "attempt $attempt failed (PyPI not serving ${VERSION} yet?); retrying in 30 s"
            sleep 30
          done
          echo "antennaknobs ${VERSION} never installed and ran from PyPI"
          exit 1
      - name: README install script against PyPI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $script = "$env:GITHUB_WORKSPACE\scripts\install-windows.ps1"
          $tmp = Join-Path ([System.IO.Path]::GetTempPath()) ([System.IO.Path]::GetRandomFileName())
          New-Item -ItemType Directory -Path $tmp | Out-Null
          Set-Location $tmp
          $pyexe = (Get-Command python).Source
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              if ("${{ matrix.pynec }}" -eq "1") {
                & $script -PythonExe $pyexe -Spec "antennaknobs[web]==$version" -PyNEC
              } else {
                & $script -PythonExe $pyexe -Spec "antennaknobs[web]==$version"
              }
              if ($LASTEXITCODE -eq 0) { exit 0 }
            } catch { Write-Host $_ }
            Write-Host "attempt $attempt failed (PyPI not serving $version yet?); retrying in 30 s"
            Start-Sleep -Seconds 30
          }
          throw "antennaknobs $version never installed and ran from PyPI"

  release:
    name: attach wheel + sdist to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # Auto-populate the release body with the merged-PR list since the
          # previous tag (GitHub's generated notes). Only fills an EMPTY body:
          # hand-written notes on a pre-created release are preserved, and a
          # grouped "Highlights" section can be added on top after the fact
          # with `gh release edit`.
          generate_release_notes: true
