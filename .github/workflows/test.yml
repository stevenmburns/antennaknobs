# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python
#
# Despite the name (kept as-is so existing required-status-check config keeps
# matching), this workflow is the whole test suite, not only Python: the
# `frontend` job at the bottom typechecks and builds the workbench UI.

name: Test Python package

on:
  pull_request:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          constraints-ci.txt
    - name: Set up ccache
      # Caches object files for the momwire C++ accelerator (built from source in
      # the "Install momwire" step). The action masquerades gcc/g++ on PATH, so
      # setuptools' default compiler invocation routes through ccache with no
      # CC/CXX overrides. Cold runs see no benefit; warm runs (the common case,
      # when _accelerators.cpp is unchanged) skip the recompile.
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ runner.os }}-py312
        max-size: 200M
        # create the gcc/g++ -> ccache shims on PATH; without this the action
        # caches ccache but nothing routes through it (the compile isn't cached).
        create-symlink: true
    - name: Install dependencies
      # Build prerequisites only: setuptools/pybind11/numpy must be present
      # before momwire's --no-build-isolation source build below. The test
      # tooling (pytest, coverage) and the web-server test client (fastapi,
      # httpx2) are NOT pinned here — they come from the declared `.[test]`
      # extra at "Install antennaknobs" so a clean clone reproduces CI with
      # `pip install -e ".[test]"`.
      # -c constraints-ci.txt pins these (and the `.[test]` extra's
      # transitive closure below) to known-good versions — see that file's
      # header for why (the ruff-0.16.0-class incident) and how to
      # regenerate it.
      run: |
        python -m pip install --upgrade pip
        pip install -c constraints-ci.txt setuptools numpy scipy matplotlib pybind11
        if [ -f requirements.txt ]; then pip install -c constraints-ci.txt -r requirements.txt; fi

    - name: Install PyNEC from the python-necpp release wheel
      # PyNEC is no longer built from a submodule — install the self-contained
      # wheel (OpenBLAS vendored via scipy-openblas32) from the python-necpp
      # fork's GitHub Release. The fork's distribution name is `pynec-accel`
      # (import name stays `PyNEC`). --no-index so upstream PyNEC/pynec on PyPI
      # (broken builds on current Python, missing our BLAS/OpenMP work) can never
      # shadow it; numpy is already installed above.
      run: |
        pip install pynec-accel --no-index \
          --find-links https://github.com/stevenmburns/python-necpp/releases/expanded_assets/v1.7.6

    - name: Install momwire (vendored MoM engine)
      # momwire is still a submodule; its C++ accelerator builds from source here.
      # --no-build-isolation so setup.py sees the numpy + pybind11 installed
      # above.
      run: |
        # NO --remote (dropped in #737): --remote checked out momwire's live
        # remote main regardless of the pointer this branch RECORDS, which
        # (a) meant CI never tested the recorded pointer (the exact gap that
        # bit PRs #268/#270), and (b) made tests/test_momwire_pin.py go red
        # on every unrelated PR the moment momwire released. The recorded
        # pointer is the contract; the pin-triple test now enforces it.
        git submodule update --init momwire
        pip install -c constraints-ci.txt --no-build-isolation -e ./momwire

    - name: Install antennaknobs
      # `.[test]` pulls in pytest + coverage + the web extra (fastapi, uvicorn,
      # …) + httpx2 for Starlette's TestClient, so the full suite — including the
      # web-server tests — runs without any ad-hoc pip installs.
      # -c constraints-ci.txt pins the resolved versions of that extra's
      # transitive closure (see the file's header).
      run: pip install -c constraints-ci.txt -e ".[test]"

    - name: Fast lane (PRs) — no per-design solver catalog, no coverage
      # Skips the antenna_computation_check tests (the per-design solver
      # catalogs). Keeps representative engine/solver coverage + all
      # load/schema/unit tests. No coverage instrumentation on PRs.
      if: github.event_name == 'pull_request'
      # `python -m pytest` (not bare `pytest`) keeps CWD on sys.path, the
      # conventional form shared with the main-lane command below. The web
      # server now lives at src/antennaknobs/web and imports as the installed
      # `antennaknobs.web` subpackage (pip install -e . above), so it no longer
      # depends on the repo root being on sys.path the way the old top-level
      # `web/` package did.
      # --durations surfaces the slowest tests each run; the conftest
      # time-budget guardrail (issue #393) additionally flags any unmarked
      # test over the 5 s ceiling. Set ANTENNAKNOBS_ENFORCE_TIME_BUDGET=1
      # here to turn that into a hard failure once the CI numbers are
      # calibrated.
      run: python -m pytest -m "not antenna_computation_check and not heavy_mesh" --durations=15 tests/

    - name: Full suite + coverage (push to main only)
      # The complete suite, including the per-design solver catalogs, with
      # coverage instrumentation. Runs once per merge to main, not per PR.
      #
      # heavy_mesh is excluded here too — benchmark-class solves are not
      # unit tests (one OOM-killed the runner on top of the catalog lane's
      # accumulated RSS). They run manually: `python -m pytest -m heavy_mesh`
      # after nec-import or engine changes.
      if: github.event_name == 'push'
      run: coverage run --source=src/ -m pytest -m "not heavy_mesh" --durations=15 tests/

    - name: Upload coverage data (push to main only)
      # The coverage-comment CONTAINER action used to live here as a step:
      # container actions build their Docker image at job start even when the
      # step's `if` is false, so every PR paid ~8 s building an image for a
      # step that only runs on push (#734). The data ships to a push-gated
      # job instead; include-hidden-files because `.coverage` is a dotfile.
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-data
        path: .coverage
        include-hidden-files: true

  coverage-comment:
    # Push-to-main only: PRs never build this action's container (#734).
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The workflow default is contents: read; the action pushes the badge/
      # data to its python-coverage-comment-action-data branch, which the old
      # inline step could do only because the BUILD job grants contents:
      # write. A job does not inherit a sibling's grants — the first push
      # run after #739 failed exactly here (GitError on git push).
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v4
      with:
        name: coverage-data
    - name: Coverage comment
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}

  wheel-smoke:
    # Install antennaknobs from the BUILT WHEEL with PyPI deps only — no git
    # submodule — and run one real solve through the web server's entry point.
    # This is the environment Fly and `pip install antennaknobs` actually get.
    # The job above installs momwire editable from the submodule, so it can
    # never catch code that uses a momwire API the pyproject version floor
    # does not guarantee; that exact split shipped v0.13.0 broken (solves used
    # momwire.CancelToken while the floor still admitted momwire 0.2.3).
    #
    # Deliberately cheap: no submodule checkout, no ccache, no PyNEC, no
    # frontend build (the server's static mount is gated on the directory
    # existing, and the smoke only calls the solve path).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      # No `submodules:` — momwire MUST come from PyPI here; that's the test.
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Build the wheel
      run: pipx run build --wheel
    - name: Install from the wheel (PyPI deps only)
      # Deliberately NOT constrained by constraints-ci.txt: this lane's whole
      # purpose is to reproduce what `pip install antennaknobs[web]` gets a
      # real user on the day they run it, floors and all. Pinning it would
      # defeat the job — it exists precisely to catch a floor that has gone
      # stale (the v0.13.0 momwire incident referenced above), which a
      # constrained install can never do.
      run: |
        WHL=$(ls dist/*.whl)
        pip install "${WHL}[web]"
    - name: Solve smoke through the server entry point
      # Run from a temp dir so a stray `momwire/` source dir on CWD can never
      # shadow the installed package.
      run: |
        SMOKE=$(pwd)/.github/scripts/wheel_solve_smoke.py
        cd "$(mktemp -d)"
        python "$SMOKE"

  frontend:
    # Typecheck + build the workbench frontend (issue #615). The bundle is
    # gitignored and built locally, so before this job a TypeScript error could
    # sit on main indefinitely — the Python jobs above never touch the frontend.
    #
    # A separate job, not a step in `build`: it shares nothing with the Python
    # lanes (no Python, no submodule, no ccache), it runs in parallel instead of
    # adding ~1 min to the critical path, and a red X here names the frontend
    # directly instead of hiding inside a Python job's log.
    #
    # No `paths:` filter, deliberately: a filtered-out job reports as "no checks
    # reported" rather than success, which branch protection cannot distinguish
    # from "still queueing" (a trap this repo has hit before). The job is ~1 min
    # with a warm npm cache, so always-run costs less than the ambiguity.
    #
    # Scope is the workbench frontend only. The docs site under site/ is a
    # separate Astro app with its own package.json; it is built and deployed by
    # deploy-docs.yml on tags and is intentionally NOT built here.
    name: frontend build + typecheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      # No `submodules:` — the frontend build is pure Node, momwire is irrelevant.
    - uses: actions/setup-node@v7
      # Same pinning as publish.yml's frontend step: Node 20 with the built-in
      # npm cache keyed on the frontend lockfile. Keep the two in sync — publish
      # builds the very same bundle into the wheel, and a version split there
      # would mean CI green on a bundle the release never builds.
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: src/antennaknobs/web/frontend/package-lock.json
    - name: Build the React frontend
      # `npm run build` is `tsc --noEmit && vite build`, so the typecheck gates
      # the bundle — a type error fails here before Vite runs.
      #
      # The output lands in src/antennaknobs/web/static (vite outDir), which is
      # gitignored. That is fine and expected: nothing downstream consumes it in
      # this job, the artifact is simply discarded when the runner is torn down.
      # The release path (publish.yml) is what actually ships the bundle.
      working-directory: src/antennaknobs/web/frontend
      run: |
        npm ci
        npm run build
    - name: Lint the frontend
      # eslint.config.js (issue #736): typescript-eslint + react-hooks +
      # testing-library, non-type-checked so this stays fast. Warnings don't
      # gate (--max-warnings=9999) — testing-library's structure-coupled
      # query rules are downgraded to warn for the pre-existing test suite,
      # not silenced, so `npm run lint`'s warning count stays visible in the
      # log without failing the build; only errors (rules-of-hooks,
      # exhaustive-deps, ...) fail this step.
      working-directory: src/antennaknobs/web/frontend
      run: npm run lint -- --max-warnings=9999
    - name: Unit-test the frontend (lib logic + mounted components)
      # Vitest: the pure lib/ functions (issue #642) plus Testing Library
      # component tests (issue #673), run headless under jsdom (module-scope
      # WS_URL reads window.location, so a Node environment can't import the
      # app modules at all). A separate step, not folded into the run block above, so a
      # failure here is named distinctly from a build failure in the log.
      working-directory: src/antennaknobs/web/frontend
      run: npm test
