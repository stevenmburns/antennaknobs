name: Ruff
# pull_request + main-push only: `on: [push, pull_request]` fired BOTH events
# for same-repo branches, running every PR's ruff twice (#734).
on:
  pull_request:
  push:
    branches: ["main"]
  # Manual re-trigger — see test.yml's workflow_dispatch note (the 2026-08-06
  # outage). Nothing here is event-gated, so a dispatched run is identical to
  # a PR run.
  workflow_dispatch:
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned, and kept in sync with the local dev venv.
      #
      # The pin STARTED as damage control: the unpinned action installs the
      # latest ruff, and 0.16.0 (released 2026-07-23, ~90 min after main's
      # last green run) flagged long-standing files repo-wide with no repo
      # change at all.
      #
      # That failure mode is gone, so do not repeat the old advice here.
      # `[tool.ruff.lint] select` is pinned explicitly in pyproject.toml
      # (#1036), so a ruff upgrade can change how a rule BEHAVES but never
      # WHICH rules run. Bumping is now a one-line edit in each of the two
      # `version:` fields below -- NOT the repo-wide `ruff check` cleanup it
      # used to imply.
      #
      # One thing a bump still moves: FORMATTING is not governed by `select`,
      # and 0.16 added Markdown to the formatter's scope. So re-run
      # `ruff format` after a bump and take the diff -- `format --check`
      # below will fail on .md files a pre-0.16 ruff never touched.
      #
      # The `version:` inputs below are also load-bearing for a second reason
      # since the action went to v3. v3 changed what happens when `version:`
      # is OMITTED: it now reads the root pyproject.toml (`dependencies` and
      # `dependency-groups.dev`) to pick a ruff, and falls back to `latest`
      # when it finds none -- which this repo's pyproject does not pin. So
      # deleting these two lines does not inherit the pin, it silently
      # restores the unpinned behaviour the comment above describes, and
      # `format --check` starts failing on files nobody edited. Keep them.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.5"
          args: "check"
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.5"
          args: "format --check"