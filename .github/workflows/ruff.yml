name: Ruff
# pull_request + main-push only: `on: [push, pull_request]` fired BOTH events
# for same-repo branches, running every PR's ruff twice (#734).
on:
  pull_request:
  push:
    branches: ["main"]
  # Manual re-trigger — see test.yml's workflow_dispatch note (the 2026-08-06
  # outage). Nothing here is event-gated, so a dispatched run is identical to
  # a PR run.
  workflow_dispatch:
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned: the unpinned action installs the latest ruff, and 0.16.0
      # (released 2026-07-23, ~90 min after main's last green run) flags
      # long-standing files repo-wide. Keep in sync with the local dev venv;
      # bump deliberately alongside a repo-wide `ruff check` cleanup.
      - uses: astral-sh/ruff-action@v1
        with:
          version: "0.16.5"
          args: "check"
      - uses: astral-sh/ruff-action@v1
        with:
          version: "0.16.5"
          args: "format --check"